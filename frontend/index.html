<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOCALIS</title>
    <style>
      .manual-doc-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 24px;
        background: #007cba;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      .manual-doc-btn:hover {
        background: #005a87;
      }
      .manual-doc-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .manual-doc-btn.loading {
        position: relative;
        color: transparent;
      }
      .manual-doc-btn.loading::after {
        content: 'Generando...';
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Contenedor para el boton de documentacion -->
    <div id="docButtonContainer" style="display: none;"></div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Variable para prevenir clics multiples
      let isGenerating = false;
      let docBtn = null;
      let buttonAdded = false;

      function generateDocumentation(event) {
        event.preventDefault();
        event.stopPropagation();

        // Prevenir multiples clics
        if (isGenerating) {
          return;
        }

        const btn = document.getElementById('manualDocBtn');
        if (!btn) return;

        isGenerating = true;
        btn.disabled = true;
        btn.classList.add('loading');

        // Obtener el nombre del repositorio desde la API
        fetch('/api/workspace')
          .then(r => r.json())
          .then(workspace => {
            const projectName = workspace.name || workspace.path || 'Proyecto';

            // Llamar al endpoint de generacion automatica
            fetch('/api/docs/generate-auto', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                projectName: projectName,
                author: 'Usuario',
                team: 'Equipo'
              })
            })
            .then(response => {
              if (!response.ok) {
                throw new Error('Error generando documentación: ' + response.status);
              }
              return response.blob();
            })
            .then(blob => {
              const url = window.URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'Documentacion_' + projectName.replace(/[^\p{L}\p{N} _.-]/g, '') + '.docx';
              document.body.appendChild(a);
              a.click();
              window.URL.revokeObjectURL(url);
              document.body.removeChild(a);
              btn.disabled = false;
              btn.classList.remove('loading');
              btn.textContent = 'Generar Documentación';
            })
            .catch(error => {
              alert('Error: ' + error.message);
              btn.disabled = false;
              btn.classList.remove('loading');
              btn.textContent = 'Generar Documentación';
            })
            .finally(() => {
              isGenerating = false;
            });
          })
          .catch(error => {
            alert('Error al obtener información del repositorio: ' + error.message);
            btn.disabled = false;
            btn.classList.remove('loading');
            btn.textContent = 'Generar Documentación';
            isGenerating = false;
          });
      }

      // Crear el boton despues de que React haya terminado
      function createDocButton() {
        if (buttonAdded) return;
        buttonAdded = true;

        // Verificar si el boton ya existe
        if (!document.getElementById('manualDocBtn')) {
          docBtn = document.createElement('button');
          docBtn.id = 'manualDocBtn';
          docBtn.className = 'manual-doc-btn';
          docBtn.textContent = 'Generar Documentación';
          document.body.appendChild(docBtn);
          console.log('Botón de documentación creado');
        } else {
          docBtn = document.getElementById('manualDocBtn');
          console.log('Botón de documentación ya existe');
        }

        docBtn.addEventListener('click', generateDocumentation);
        console.log('Event listener añadido al botón');
      }

      // Usar MutationObserver para detectar cuando React termina
      const observer = new MutationObserver(function(mutations, obs) {
        // Buscar el panel lateral (aside) que contiene el RepoPanel
        const aside = document.querySelector('aside.side');
        if (aside) {
          // Buscar el boton Configurar en el RepoPanel
          const configureBtn = aside.querySelector('button');
          if (configureBtn) {
            // React ha renderizado el RepoPanel, ahora podemos anadir nuestro boton
            setTimeout(createDocButtonInRepoPanel, 500);
            obs.disconnect();
          }
        }
      });

      // Funcion para crear el boton dentro del RepoPanel
      function createDocButtonInRepoPanel() {
        if (buttonAdded) return;
        buttonAdded = true;

        const aside = document.querySelector('aside.side');
        if (!aside) {
          setTimeout(createDocButtonInRepoPanel, 500);
          return;
        }

        // Buscar el div de botones en el RepoPanel
        const btnRow = aside.querySelector('.btn-row');
        if (btnRow) {
          // Crear el boton
          docBtn = document.createElement('button');
          docBtn.id = 'manualDocBtn';
          docBtn.className = 'secondary manual-doc-btn';
          docBtn.textContent = 'Generar Documentación';
          btnRow.appendChild(docBtn);
          console.log('Botón añadido al RepoPanel');
        } else {
          // Si no encuentra el btn-row, crear el boton al final del aside
          docBtn = document.createElement('button');
          docBtn.id = 'manualDocBtn';
          docBtn.className = 'manual-doc-btn';
          docBtn.textContent = 'Generar Documentación';
          aside.appendChild(docBtn);
          console.log('Botón añadido al final del aside');
        }

        docBtn.addEventListener('click', generateDocumentation);
        console.log('Event listener añadido');
      }

      // Observar cambios en el body
      observer.observe(document.body, { childList: true, subtree: true });

      // Tambien intentar despues de un tiempo por si acaso
      setTimeout(createDocButtonInRepoPanel, 2000);
      setTimeout(createDocButtonInRepoPanel, 5000);
    </script>
  </body>
</html>
